<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />

  <title>Zero-Proof Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="/sipsoberleaflet/manifest.json">
  <meta name="theme-color" content="#202329">
  <link rel="apple-touch-icon" href="/sipsoberleaflet/icons/icon-192.png">
  <link rel="icon" href="/sipsoberleaflet/icons/icon-192.png">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />

  <!-- FIX: Leaflet JS in <head> so it's parsed before DOMContentLoaded -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="anonymous"></script>

  <style>
/* =========================================================
   BREW BREAK — MAP REDESIGN
   Warm editorial map + floating discovery cards
========================================================= */

:root {
  /* SIP SOBER / XCODE */
  --espresso: #F7F7FA;
  --espresso-deep: #FFFFFF;
  --coffee: #D7D9E3;

  --cream: #1B1E31;
  --cream-2: #1F2237;
  --cream-3: #252A3F;

  --taupe: rgba(255,255,255,.62);
  --muted: rgba(255,255,255,.46);

  --line: rgba(255,255,255,.08);
  --shadow: rgba(0,0,0,.20);

  --map-height: 66vh;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    system-ui,
    sans-serif;

  background: #fffaf4;
  color: var(--espresso);

  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  display: flex;
  flex-direction: column;
}


/* =========================================================
   MAP
========================================================= */

#map {
  position: relative;
  width: 100%;
  height: var(--map-height);
  min-height: 340px;
  max-height: 570px;
  flex: 0 0 auto;

  background:
  linear-gradient(
    180deg,
    #D9DCE5 0%,
    #E4E6EC 45%,
    #EEEFF3 100%
  );

  overflow: hidden;

  will-change: transform;
  -webkit-transform: translateZ(0);
  transform: translateZ(0);
}

@supports (height: 100dvh) {
  :root {
    --map-height: 66dvh;
  }
}

body.map-loading #map {
  opacity: 0;
}

body.map-ready #map {
  opacity: 1;
  transition: opacity .28s ease;
}


/* =========================================================
   LEAFLET MAP COLOR TREATMENT
========================================================= */

.leaflet-container {
  position: relative;
  background: #E6E8ED;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    system-ui,
    sans-serif;
}

/*
   The map should feel atmospheric, not like a stock map.
*/
.leaflet-tile {
  filter:
    saturate(.55)
    brightness(.98)
    contrast(.88)
    hue-rotate(175deg);
}

.leaflet-tile-pane {
  opacity: .91;
}


/* Warm overall wash */

.leaflet-container::before {
  content: "";
  position: absolute;
  inset: 0;

  z-index: 245;
  pointer-events: none;

  background:
    linear-gradient(
      180deg,
      rgba(27, 30, 49, .22) 0%,
      rgba(31, 34, 55, .13) 30%,
      rgba(34, 38, 58, .06) 60%,
      rgba(27, 30, 49, .12) 100%
    );

  mix-blend-mode: multiply;
}


/*
   Atmospheric top/bottom fade.
   This creates the ombré look from the Brew Break concept.
*/

.leaflet-container::after {
  content: "";
  position: absolute;
  inset: 0;

  z-index: 900;
  pointer-events: none;

  background:
    linear-gradient(
      180deg,
      rgba(42, 33, 29, 1) 0%,
      rgba(42, 33, 29, .97) 7%,
      rgba(52, 41, 35, .90) 15%,
      rgba(68, 55, 47, .76) 25%,
      rgba(89, 76, 68, .54) 36%,
      rgba(111, 101, 95, .30) 47%,
      rgba(125, 118, 114, .12) 56%,
      rgba(125, 118, 114, 0) 65%
    );
} 
    
.leaflet-marker-pane {
  z-index: 1000 !important;
}

.leaflet-tooltip-pane {
  z-index: 1100 !important;
}

.leaflet-popup-pane {
  z-index: 1200 !important;
}

/* =========================================================
   MOMENT FILTERS
   Brew Break editorial moment selector
========================================================= */

#filters {
  position: absolute;
  top: 12px;
  left: 0;
  right: 0;

  z-index: 3000;

  padding: 0 22px;

  pointer-events: none;
}

#filters-main {
  width: 100%;

  display: flex;
  align-items: center;

  pointer-events: auto;
}

#moment-bar {
  width: 100%;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;

  overflow: visible;

  background: transparent;
  border: 0;
  box-shadow: none;

  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

#moment-bar::-webkit-scrollbar {
  display: none;
}


/* -------------------------
   MOMENT
------------------------- */

.moment-pill {
  appearance: none;
  -webkit-appearance: none;

  position: relative;

  flex: 0 0 auto;

  height: 30px;
  padding: 0 4px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  border: 0;
  border-radius: 0;

  background: transparent;

  color: rgba(255, 249, 243, .62);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    system-ui,
    sans-serif;

  font-size: 11px;
  font-weight: 600;

  letter-spacing: .01em;

  white-space: nowrap;
  cursor: pointer;

  box-shadow: none;

  transition:
    color .22s ease,
    opacity .22s ease,
    transform .16s ease;
}


/* -------------------------
   ACTIVE INDICATOR
------------------------- */

.moment-pill::after {
  content: "";

  position: absolute;

  left: 50%;
  bottom: 0;

  width: 0;
  height: 2px;

  border-radius: 999px;

  background: #C88A62;

  opacity: 0;

  transform: translateX(-50%);

  transition:
    width .24s ease,
    opacity .20s ease;
}


/* -------------------------
   ACTIVE
------------------------- */

.moment-pill.active {
  background: transparent;
  border: 0;

  color: #FFF9F3;

  box-shadow: none;
}

.moment-pill.active::after {
  width: 18px;
  opacity: 1;
}


/* -------------------------
   PRESS
------------------------- */

.moment-pill:active {
  transform: scale(.96);
}


/* =========================================================
   RIGHT MAP CONTROLS
========================================================= */

#toolbar-actions {
  position: absolute;

  right: 14px;
  top: calc(var(--map-height) - 96px);

  z-index: 3200;

  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toolbar-icon-btn {
  appearance: none;
  -webkit-appearance: none;

  width: 42px;
  height: 42px;

  padding: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  border: 1px solid rgba(70, 50, 40, .09);

  background: rgba(255, 250, 245, .94);

  color: #3c2b24;

  font-size: 17px;
  font-weight: 600;

  box-shadow:
    0 7px 20px rgba(51, 34, 27, .12),
    inset 0 1px 0 rgba(255,255,255,.7);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  cursor: pointer;

  transition: transform .15s ease;
}

.toolbar-icon-btn:active {
  transform: scale(.92);
}


/* =========================================================
   BOTTOM DISCOVERY SHEET
   BREW BREAK — DARK ESPRESSO
========================================================= */

#bottom-panel {
  position: relative;

  flex: 1 1 auto;
  min-height: 0;
  margin-top: -14px;

  z-index: 500;

  display: flex;
  flex-direction: column;

  padding: 0;

  background:
    radial-gradient(
      circle at 12% 0%,
      rgba(154, 120, 100, .14),
      transparent 38%
    ),
    linear-gradient(
      160deg,
      #352923 0%,
      #30251F 46%,
      #291F1B 100%
    );

  border-radius: 0;
  border-top: 0;
  box-shadow: none;

  overflow: hidden;
}


#panel-header {
  display: none;
}


#panel-body {
  flex: 1 1 auto;
  min-height: 0;

  overflow-y: auto;
  overflow-x: hidden;

  -webkit-overflow-scrolling: touch;

  padding: 0;

  scrollbar-width: none;

  /* Never expose a white surface during iOS scroll bounce */
  background:
    radial-gradient(
      circle at 12% 0%,
      rgba(154, 120, 100, .14),
      transparent 38%
    ),
    linear-gradient(
      160deg,
      #352923 0%,
      #30251F 46%,
      #291F1B 100%
    );

  overscroll-behavior-y: contain;
}

#panel-body::-webkit-scrollbar {
  display: none;
}


#results {
  padding: 0;
}


/* =========================================================
   RESULTS HEADER
========================================================= */

#panel-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;
}


#panel-meta-row .active-filters {
  flex: 1 1 auto;

  display: none;
  flex-wrap: wrap;

  gap: 6px;

  margin: 0;
  padding: 0;
}


#panel-meta-row > div:last-child {
  width: 100%;

  display: flex !important;
  align-items: center !important;
  justify-content: flex-start !important;

  gap: 8px !important;
}


#sortBtn {
  appearance: none;
  -webkit-appearance: none;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  height: 27px;
  padding: 0 10px;

  border-radius: 999px;

  background: rgba(255, 249, 243, .055);

  border:
    1px solid rgba(255, 249, 243, .07);

  color:
    rgba(242, 232, 224, .58);

  font-size: 10.5px;
  font-weight: 650;

  letter-spacing: .03em;

  pointer-events: none;
}


#results-count {
  margin: 0;

  font-size: 12.5px;
  font-weight: 600;

  color:
    rgba(242, 232, 224, .55);

  white-space: nowrap;
}


/* =========================================================
   MAP SUMMARY
========================================================= */

.map-summary-card {
  padding: 21px 22px 20px;
}


.map-summary-eyebrow,
.selected-venue-eyebrow {
  margin-bottom: 9px;

  color:
    rgba(232, 213, 197, .48);

  font-size: 9.5px;
  font-weight: 650;

  letter-spacing: .16em;
  text-transform: uppercase;
}


.map-summary-title {
  margin: 0 0 7px;

  color: #FFF9F3;

  font-size: 22px;
  font-weight: 650;

  line-height: 1.08;
  letter-spacing: -.035em;
}


.map-summary-copy {
  max-width: 320px;

  margin: 0;

  color:
    rgba(234, 221, 212, .55);

  font-size: 12.5px;
  font-weight: 400;

  line-height: 1.45;
}


/* =========================================================
   BROWSE VENUES
========================================================= */

.venue-browser {
  padding: 0 22px 24px;
}

.venue-browser-list {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.venue-browse-card {
  appearance: none;
  -webkit-appearance: none;

  width: 100%;
  padding: 17px 0;

  display: block;

  border: 0;
  border-bottom: 1px solid rgba(255, 249, 243, .10);
  border-radius: 0;

  background: transparent;

  font-family: inherit;
  text-align: left;

  cursor: pointer;
  box-shadow: none;

  transition:
    opacity .16s ease,
    background .16s ease;
}

.venue-browse-card:active {
  transform: none;
  background: rgba(255, 249, 243, .025);
  opacity: .75;
}


.venue-browse-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;

  gap: 12px;
}


.venue-browse-name {
  min-width: 0;

  color: #FFF9F3;

  font-size: 14px;
  font-weight: 650;

  line-height: 1.2;

  letter-spacing: -.02em;
}


.venue-browse-arrow {
  flex: 0 0 auto;

  color:
    rgba(255, 249, 243, .28);

  font-size: 15px;
  font-weight: 400;
}


.venue-browse-meta {
  margin-top: 4px;

  color:
    rgba(234, 221, 212, .46);

  font-size: 10.5px;
  font-weight: 500;
  line-height: 1.25;
}

.venue-browse-address {
  margin-top: 3px;

  color:
    rgba(234, 221, 212, .38);

  font-size: 10px;
  font-weight: 450;
  line-height: 1.3;
}


.venue-browse-note {
  margin-top: 8px;

  color:
    rgba(242, 232, 224, .62);

  font-size: 11.5px;
  font-weight: 400;
  line-height: 1.4;
}


.venue-browse-moments {
  display: flex;
  flex-wrap: wrap;

  gap: 5px;
  margin-top: 11px;
}


.venue-moment-tag {
  display: inline-flex;
  align-items: center;

  min-height: 22px;
  padding: 0 8px;
  border-radius: 999px;

  background:
    rgba(200, 138, 98, .10);

  border:
    1px solid rgba(200, 138, 98, .08);

  color:
    rgba(225, 166, 127, .82);

  font-size: 9.5px;
  font-weight: 650;
  text-transform: capitalize;
}
    

/* =========================================================
   SELECTED VENUE — DETAIL PANEL
========================================================= */

.selected-venue-card {
  position: relative;
  padding: 0 0 22px;
}


/* =========================================================
   SELECTED VENUE IMAGE
   Map → photo → espresso
========================================================= */

.selected-venue-image-wrap {
  position: relative;
  width: 100%;
  height: 240px;
  margin-top: -34px;
  overflow: hidden;

  border: 0;
  border-radius: 0;
  box-shadow: none;
  background: transparent;
}


/* Café photo */

.selected-venue-image {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center;

  -webkit-mask-image: none;
  mask-image: none;
}

    
/* Favorite button over photo */

.selected-fav {
  position: absolute;

  top: 14px;
  right: 16px;

  z-index: 2;

  width: 38px;
  height: 38px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;

  border: 1px solid rgba(255,255,255,.22);
  border-radius: 50%;

  background: rgba(42, 33, 29, .54);
  color: #FFF9F3;
  font-size: 19px;

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  box-shadow:
    0 4px 14px rgba(42, 33, 29, .16);
}

.selected-fav.is-fav {
  color: #E8A47C;
}


/* -------------------------
   CONTENT
------------------------- */

.selected-venue-content {
  position: relative;
  z-index: 2;

  padding: 14px 20px 0;
}

.selected-venue-top {
  display: flex;
  align-items: flex-start;

  gap: 14px;
}

.selected-venue-info {
  flex: 1;
  min-width: 0;
}

.selected-venue-name {
  margin: 0;

  color: #FFF9F3;
  font-size: 19px;
  font-weight: 700;

  line-height: 1.2;
  letter-spacing: -.025em;
}

.selected-venue-meta {
  margin-top: 6px;
  color: rgba(61, 47, 41, .50);

  font-size: 12px;
  font-weight: 550;
  line-height: 1.3;
}

.selected-venue-address {
  margin-top: 5px;
  color: rgba(255, 249, 243, .88);

  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
}

.selected-venue-note {
  max-width: 340px;
  margin-top: 9px;

  color: rgba(61, 47, 41, .68);

  font-size: 12px;
  font-weight: 450;
  line-height: 1.45;
}


/* -------------------------
   MOMENT TAGS
------------------------- */

.selected-venue-moments {
  display: flex;
  flex-wrap: wrap;

  gap: 6px;
  margin-top: 12px;
}

.selected-venue-moment {
  min-height: 25px;

  display: inline-flex;
  align-items: center;

  padding: 0 10px;
  border-radius: 999px;
  background: rgba(61, 47, 41, .065);

  border: 1px solid rgba(61, 47, 41, .055);
  color: rgba(61, 47, 41, .68);

  font-size: 9.5px;
  font-weight: 700;

  letter-spacing: .055em;
  text-transform: uppercase;
}

/* =========================================
   VENUE DETAILS — ALWAYS VISIBLE
========================================= */

.selected-venue-details {
  margin-top: 20px;
  padding-top: 0;
  border-top: none;
}

.selected-details-heading {
  margin-bottom: 2px;
  color: #FFF9F3;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.2px;
}

.selected-details-list {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.selected-details-item {
  display: flex;
  align-items: center;
  gap: 12px;

  padding: 10px 2px;

  border: 0;
  border-bottom: 1px solid rgba(255, 249, 243, .09);
  border-radius: 0;

  background: transparent;

  color: rgba(255, 249, 243, .80);
  font-size: 13px;
  line-height: 1.45;
}

.selected-details-dot {
  flex: 0 0 6px;
  width: 6px;
  height: 6px;
  margin-top: 7px;
  border-radius: 50%;
  background: #C88A62;
}
  

/* -------------------------
   QUICK ACTIONS
------------------------- */

.selected-venue-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 8px;
  margin-top: 16px;
}

.selected-venue-secondary {
  appearance: none;
  -webkit-appearance: none;

  min-height: 40px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0 12px;

  border: 1px solid rgba(61, 47, 41, .09);
  border-radius: 14px;

  background: rgba(255, 250, 245, .52);

  color: #4A3931;
  font-family: inherit;

  font-size: 12px;
  font-weight: 650;
  text-decoration: none;

  transition:
    transform .15s ease,
    background .15s ease;
}

.selected-venue-secondary:active {
  transform: scale(.98);

  background: rgba(255, 250, 245, .72);
}


/* -------------------------
   PLAN HERE
------------------------- */

.selected-venue-plan {
  appearance: none;
  -webkit-appearance: none;

  width: 100%;
  min-height: 44px;

  margin-top: 10px;
  padding: 0 16px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border: 0;
  border-radius: 15px;

  background: #30241F;

  color: #FFF9F3;

  font-family: inherit;

  font-size: 13px;
  font-weight: 650;

  letter-spacing: -.01em;

  box-shadow:
    0 7px 18px rgba(48, 36, 31, .14),
    inset 0 1px 0 rgba(255,255,255,.06);

  cursor: pointer;

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.selected-venue-plan:active {
  transform: scale(.985);

  box-shadow:
    0 3px 10px rgba(48, 36, 31, .10);
}

.selected-venue-plan-arrow {
  font-size: 17px;
  font-weight: 400;

  opacity: .80;
}


/* -------------------------
   NO IMAGE FALLBACK
------------------------- */

.selected-venue-card.no-image {
  padding-top: 0;
}

.selected-venue-card.no-image .selected-venue-content {
  position: relative;

  padding-top: 15px;
}

.selected-venue-card.no-image .selected-fav {
  position: static;

  flex: 0 0 auto;

  width: 36px;
  height: 36px;
  background: rgba(61, 47, 41, .055);
  border-color: rgba(61, 47, 41, .07);
  color: rgba(61, 47, 41, .36);

  box-shadow: none;
}

.selected-venue-card.no-image .selected-fav.is-fav {
  color: #30241F;
}


/* =========================================================
   FAVORITES
========================================================= */

.fav-btn {
  position: relative;
  z-index: 3;

  appearance: none;

  border: 0;
  background: transparent;

  padding: 2px;

  color: #B6BAC8;

  font-size: 19px;

  line-height: 1;

  cursor: pointer;

  transition:
    color .16s ease,
    transform .16s ease;
}

.fav-btn:active {
  transform: scale(.86);
}

.fav-btn.is-fav {
  color: #1F2237;
}


/* =========================================================
   ACTIVE FILTER
========================================================= */

.active-filters {
  display: none;
}

.filter-pill {
  display: inline-flex;
  align-items: center;

  gap: 5px;

  padding: 4px 8px;

  border-radius: 999px;

  background: #f1e6dc;

  color: #75655c;

  font-size: 10.5px;
  font-weight: 650;
}

.filter-pill-x {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  width: 15px;
  height: 15px;

  border-radius: 50%;

  background: rgba(64, 46, 38, .06);

  color: #75655c;

  font-size: 11px;

  cursor: pointer;
}


/* =========================================================
   SELECTED PIN — VENUE NAME
========================================================= */

.leaflet-tooltip.brewbreak-pin-label {
  padding: 6px 9px;

  border: 0;
  border-radius: 8px;

  background: rgba(42, 33, 29, .90);

  color: #FFF9F3;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    system-ui,
    sans-serif;

  font-size: 10.5px;
  font-weight: 650;
  line-height: 1;

  letter-spacing: -.01em;

  white-space: nowrap;

  box-shadow:
    0 4px 12px rgba(42, 33, 29, .16);

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.leaflet-tooltip-top.brewbreak-pin-label::before {
  border-top-color: rgba(42, 33, 29, .90);
}


/* =========================================================
   HIDE DEFAULT LEAFLET CONTROLS
========================================================= */

.leaflet-control-zoom {
  display: none !important;
}

.leaflet-control-attribution {
  opacity: .38;

  font-size: 7px !important;

  background:
    rgba(255,250,245,.58) !important;
}


/* =========================================================
   USER LOCATION
========================================================= */

.leaflet-interactive {
  transition:
    fill .2s ease,
    stroke .2s ease;
}


/* =========================================================

let map, markersLayer, markersById={};
let _mapReady=false, _pendingUserLocation=null;
let currentMoment = "all";
let _didReceiveInitialMoment = false;
let _userLocationForDistance=null, _userDot=null, _userHalo=null;
let _activeMarker=null, _lastFocusedVenueId=null;
let _suppressAutoFit = false;
let defaultIcon, activeIcon, currentIcon;
const mobileQuery = window.matchMedia("(max-width:767px)");

const manhattanLockBounds    = L.latLngBounds([40.5,-74.3],[40.98,-73.6]);
const manhattanInitialBounds = L.latLngBounds([40.70,-74.05],[40.88,-73.90]);

/* ─────────────────────────────────────────────────────────────────
   FIX 2: Map initialises AFTER the browser has completed its first
   paint. This guarantees Leaflet reads the true #map dimensions,
   which eliminates both the grey-tile gap and the layout jump.
   ───────────────────────────────────────────────────────────────── */
function _initMap(){
  map = L.map("map",{
    zoomControl: false,
    scrollWheelZoom: true,
    preferCanvas: true,
    // FIX 3: tap:false stops Leaflet's iOS tap shim from triggering
    // an unwanted invalidateSize() that causes the visible jump.
    tap: false
  }).setView([40.758, -73.9855],11.2);

  const tiles = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png?key=cb1_32mn_1_c50a8550ac3189af34a5b1e6",
  {
    maxZoom: 20,
    subdomains: "abcd",
    attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
    updateWhenIdle: true,
    keepBuffer: 6,
    detectRetina: false,
    updateWhenZooming: false
  }
);

  tiles.addTo(map);

  tiles.once("load", () => {
    document.body.classList.remove("map-loading");
    document.body.classList.add("map-ready");
    if (map) {
      map.invalidateSize({ animate: false, pan: false });
    }
  });

  map.setMaxBounds(manhattanLockBounds);
  map.options.maxBoundsViscosity = 0.1;
  map.setMinZoom(11.5);
  markersLayer = L.layerGroup().addTo(map);

  /* ─── FIX 5: Clean, two-step invalidateSize sequence ────────────
     • rAF frame 1 → layout is done
     • rAF frame 2 → paint is done → NOW call invalidateSize
     • 300 ms later → catch any WKWebView async settle
  ────────────────────────────────────────────────────────────── */
  function kickSize() {
    if (!map) return;
    requestAnimationFrame(() => {
      map.invalidateSize({ animate: false, pan: false });
    });
  }

  map.whenReady(() => {
    kickSize();
    setTimeout(() => {
      if (map) map.invalidateSize({ animate: false, pan: false });
    }, 150);
  });

  window.addEventListener("resize", kickSize);
  window.addEventListener("orientationchange", () => {
    setTimeout(kickSize, 150);
  });

  _buildIcons();
  applyIconForViewport();
  mobileQuery.addEventListener("change", applyIconForViewport);

  _mapReady = true;
  if(_pendingUserLocation){
    window.SipSober.setUserLocation(_pendingUserLocation.lat,_pendingUserLocation.lng);
    _pendingUserLocation = null;
  }

  if (!window.SipSober.isEmbed || _didReceiveInitialMoment) {
    applyFiltersUnified();
  }
  
  window.SipSober?.sendVenuesToNative?.();
  kickSize();
}

// Start the map as soon as the DOM is ready
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", () => {
    requestAnimationFrame(_initMap);
  });
} else {
  requestAnimationFrame(_initMap);
}

function makePinIconSVG(hex="#3A2B24", size=[24,24], opts = {}) {
  const [w, h] = size;
  const isActive = opts.active === true;

  const bg = isActive ? "#FFF9F3" : hex;
  const fg = isActive ? hex : "#FFF9F3";
  const stroke = isActive ? hex : "rgba(255,255,255,.16)";

  return `
  <svg xmlns="http://www.w3.org/2000/svg"
       width="${w}"
       height="${h}"
       viewBox="0 0 24 24">

    <defs>
      <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow
          dx="0"
          dy="1.5"
          stdDeviation="1.4"
          flood-color="#2A211D"
          flood-opacity=".24"/>
      </filter>
    </defs>

    <circle
      cx="12"
      cy="12"
      r="9.5"
      fill="${bg}"
      stroke="${stroke}"
      stroke-width="${isActive ? 1.5 : 1}"
      filter="url(#shadow)"
    />

    <!-- Minimal coffee cup -->
    <path
      d="M7.6 9.1
         H14.4
         V12.1
         C14.4 14.0 13.1 15.1 11.0 15.1
         C8.9 15.1 7.6 14.0 7.6 12.1
         Z"
      fill="none"
      stroke="${fg}"
      stroke-width="1.35"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <path
      d="M14.4 10
         H15.1
         C16.2 10 16.6 10.7 16.6 11.5
         C16.6 12.4 16.0 13 14.8 13"
      fill="none"
      stroke="${fg}"
      stroke-width="1.35"
      stroke-linecap="round"
    />

    <path
      d="M8.7 16
         H14.2"
      fill="none"
      stroke="${fg}"
      stroke-width="1.2"
      stroke-linecap="round"
    />

  </svg>
  `;
}

function makeIcon(size=[24,24], color="#3A2B24", active=false){
  return L.icon({
    iconUrl:
      "data:image/svg+xml;utf8," +
      encodeURIComponent(
        makePinIconSVG(color, size, { active })
      ),
    iconSize: size,
    iconAnchor: [Math.floor(size[0] / 2), size[1]],
    popupAnchor: [0, -Math.floor(size[1] * 0.84)]
  });
}

function _buildIcons() {
  const isMobile = mobileQuery.matches;

  if (isMobile) {
    defaultIcon = makeIcon([22,22], "#49362D", false);
    activeIcon  = makeIcon([30,30], "#49362D", true);
  } else {
    defaultIcon = makeIcon([22,22], "#49362D", false);
    activeIcon  = makeIcon([30,30], "#49362D", true);
  }

  currentIcon = defaultIcon;
  L.Marker.prototype.options.icon = currentIcon;
}

const __origMarkerFactory = L.marker;
L.marker = function(latlng,options){
  const opts=options||{};
  if(!opts.icon) opts.icon=currentIcon||makeIcon();
  return __origMarkerFactory.call(this,latlng,opts);
};

function setActiveMarker(m){
  if(_activeMarker&&_activeMarker!==m) _activeMarker.setIcon(defaultIcon);
  _activeMarker=m||null;
  if(_activeMarker) _activeMarker.setIcon(activeIcon);
}

function clearActiveMarker(){
  if(_activeMarker) _activeMarker.setIcon(defaultIcon);
  _activeMarker=null;
}

function applyIconForViewport(){
  if(!map) return;
  _buildIcons();
  if(markersLayer&&markersLayer.eachLayer){
    markersLayer.eachLayer(layer=>{
      if(!layer||typeof layer.setIcon!=="function") return;
      layer.setIcon(layer===_activeMarker?activeIcon:defaultIcon);
    });
  }
}

function normalizeUrl(u){
  u=String(u||"").trim();
  if(!u||u.toLowerCase()==="n/a") return "";
  if(!/^https?:\/\//i.test(u)) u="https://"+u;
  return u;
}

function matchesSearch(loc,q){
  if(!q) return true;
  return [loc.name, loc.address, loc.neighborhood]
    .filter(Boolean)
    .join(" ")
    .toLowerCase()
    .includes(q.toLowerCase());
}

function matchesMoment(loc){
  if(currentMoment === "all") return true;

  const moments = Array.isArray(loc.moments)
    ? loc.moments.map(m => String(m).toLowerCase())
    : [];

  return moments.includes(currentMoment);
}

  l.textContent = currentMoment.charAt(0).toUpperCase() + currentMoment.slice(1);

  p.appendChild(x);
  p.appendChild(l);
  c.appendChild(p);
}

/* ─── NATIVE BRIDGE ────────────────────────────────────────────── */
let _didSendVenuesToNative=false;
function _venueForNative(loc){
  return {
    id: String(loc.id || ""),
    name: String(loc.name || ""),
    address: String(loc.address || ""),
    neighborhood: String(loc.neighborhood || ""),
    website: normalizeUrl(loc.website || ""),
    lat: Number(loc.lat || 0),
    lng: Number(loc.lng || 0),
    imageUrl: String(loc.imageUrl || "")
  };
}
  
window.SipSober.sendVenuesToNative=function(arg){
  try{
    const force=(typeof arg==="boolean")?arg:false;
    const source=Array.isArray(arg)?arg:(locations||[]);
    if(_didSendVenuesToNative&&!force&&!Array.isArray(arg)) return;
    const venues=source.map(_venueForNative).filter(v=>v.id&&v.name);
    if(window.webkit?.messageHandlers?.sipSober){
      window.webkit.messageHandlers.sipSober.postMessage({type:"venues",venues});
      _didSendVenuesToNative=true;
    }
  }catch(e){}
};

window.addEventListener("load",()=>setTimeout(()=>window.SipSober.sendVenuesToNative(),400));

/* ─── RENDERERS ────────────────────────────────────────────────── */
function renderMarkers(data) {
  if (!markersLayer) return { count: 0, bounds: null };

  markersLayer.clearLayers();
  clearActiveMarker();
  markersById = {};

  const bounds = L.latLngBounds([]);

  data.forEach(loc => {
    const m = L.marker([loc.lat, loc.lng]).addTo(markersLayer);

    m.on("click", () => {
      const ll = m.getLatLng();

      // Prevent another render from changing the map view
      _suppressAutoFit = true;

      // Select this venue
      setActiveMarker(m);
      _lastFocusedVenueId = String(loc.id || "");

      // Open detail first so the map changes to detail height
      renderSelectedVenue(loc);

      // Wait for the new map height to finish laying out,
      // then zoom directly into the selected café.
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (!map) return;

          map.invalidateSize({
            animate: false,
            pan: false
          });

          map.flyTo(
            [ll.lat, ll.lng],
            16,
            {
              animate: true,
              duration: 0.45,
              easeLinearity: 0.25
            }
          );

          m.bindTooltip(loc.name || "", {
            permanent: false,
            direction: "top",
            offset: [0, -16],
            opacity: 1,
            className: "brewbreak-pin-label"
          }).openTooltip();

          _suppressAutoFit = false;
        });
      });
    });

    if (loc.id) {
      markersById[String(loc.id)] = m;
    }

    bounds.extend([loc.lat, loc.lng]);
  });

  return {
    count: data.length,
    bounds: data.length ? bounds : null
  };
}

function renderList(data) {
  const results = document.getElementById("results");
  const rc = document.getElementById("results-count");

  if (!results) return;

  document.body.classList.remove("venue-detail-open");

  results.innerHTML = "";

  if (rc) {
    rc.textContent = data.length === 0
      ? "No spots"
      : `${data.length} spot${data.length === 1 ? "" : "s"}`;
  }

  /* -----------------------------
     EMPTY STATE
  ----------------------------- */

  if (!data.length) {
    results.innerHTML = `
      <div class="map-summary-card">

        <div class="map-summary-eyebrow">
          No matches
        </div>

        <div class="map-summary-title">
          Try another moment
        </div>

        <div class="map-summary-copy">
          Switch the filter above to explore more coffee spots.
        </div>

      </div>
    `;

    return;
  }


  /* -----------------------------
     SUMMARY COPY
  ----------------------------- */

  let eyebrow = "Explore NYC";
  let title = `${data.length} coffee spots`;
  let copy = "Explore the map or browse the spots below.";

  if (currentMoment !== "all") {

    const momentContent = {

      quick: {
        eyebrow: "Quick",
        title: `${data.length} spots for a quick coffee`,
        copy: "Easy stops for when you need something nearby."
      },

      work: {
        eyebrow: "Work",
        title: `${data.length} spots worth settling into`,
        copy: "Picked for laptops, longer stays, and getting something done."
      },

      relax: {
        eyebrow: "Relax",
        title: `${data.length} spots to slow down`,
        copy: "Quieter coffee shops for when you're not trying to be anywhere else."
      },

      social: {
        eyebrow: "Social",
        title: `${data.length} spots for catching up`,
        copy: "Coffee shops with enough energy to stay awhile with someone."
      }

    };

    const content = momentContent[currentMoment];

    if (content) {
      eyebrow = content.eyebrow;
      title = content.title;
      copy = content.copy;
    }
  }


  /* -----------------------------
     VENUE CARDS
  ----------------------------- */

  const venueCards = data.map(loc => {

    const distance = _distanceLabelForVenue(loc);

    const meta = [
      loc.neighborhood,
      distance
    ]
      .filter(Boolean)
      .join(" • ");

    const moments = Array.isArray(loc.moments)
      ? loc.moments
      : [];

    const momentTags = moments.map(moment => `
      <span class="venue-moment-tag">
        ${moment}
      </span>
    `).join("");


    return `
      <button
        class="venue-browse-card"
        type="button"
        data-browse-venue="${loc.id}"
      >

        <div class="venue-browse-top">

          <div class="venue-browse-name">
            ${loc.name || ""}
          </div>

          <div class="venue-browse-arrow">
            →
          </div>

        </div>

        ${meta
          ? `
            <div class="venue-browse-meta">
              ${meta}
            </div>
          `
          : ""
        }
        
        ${loc.address
          ? `
            <div class="venue-browse-address">
              ${loc.address}
            </div>
          `
          : ""
        }
        
        ${loc.moment_note
          ? `
            <div class="venue-browse-note">
              ${loc.moment_note}
            </div>
          `
          : ""
        }

        ${momentTags
          ? `
            <div class="venue-browse-moments">
              ${momentTags}
            </div>
          `
          : ""
        }

      </button>
    `;

  }).join("");


  /* -----------------------------
     RENDER
  ----------------------------- */

  results.innerHTML = `

    <div class="map-summary-card">

      <div class="map-summary-eyebrow">
        ${eyebrow}
      </div>

      <div class="map-summary-title">
        ${title}
      </div>

      <div class="map-summary-copy">
        ${copy}
      </div>

    </div>


    <div class="venue-browser">

      <div class="venue-browser-list">
        ${venueCards}
      </div>

    </div>

  `;


  window.SipSober?.sendVenuesToNative?.(data);
}

/* ─── FILTER + APPLY ────────────────────────────────────────────── */
function applyFiltersUnified(){
  closeAllMenus();

  const q = (document.getElementById("searchTopInput")?.value || "").trim();

  let filtered = locations.filter(loc => {
    return matchesMoment(loc) && matchesSearch(loc, q);
  });

  const hasLoc = !!_userLocationForDistance;

  if (hasLoc) {
    filtered.sort((a, b) => {
      const da = _distanceMilesForVenue(a);
      const db = _distanceMilesForVenue(b);

      if (da == null && db == null) {
        return (a.name || "").localeCompare(b.name || "", undefined, { sensitivity: "base" });
      }
      if (da == null) return 1;
      if (db == null) return -1;
      if (da !== db) return da - db;

      return (a.name || "").localeCompare(b.name || "", undefined, { sensitivity: "base" });
    });
  } else {
    filtered.sort((a, b) =>
      (a.name || "").localeCompare(b.name || "", undefined, { sensitivity: "base" })
    );
  }

  const sortBtn = document.getElementById("sortBtn");
  if (sortBtn) sortBtn.textContent = hasLoc ? "Miles" : "A–Z";

  renderList(filtered);
  updateActiveMoment();

  if (!map) {
    window.filteredBounds = null;
    return;
  }

  const { count, bounds } = renderMarkers(filtered);

  const panel = document.getElementById("bottom-panel");
  const panelH = panel ? panel.getBoundingClientRect().height : 0;

  const isDefaultView =
    currentMoment === "all" &&
    !q.length &&
    !hasLoc;

  if (!_suppressAutoFit) {
    if (isDefaultView) {
      fitInitialView();
    } else if (count > 0 && bounds) {
      map.fitBounds(bounds, {
        paddingTopLeft: [
          22,
          window.SipSober?.isEmbed ? 68 : 105
        ],
        
        paddingBottomRight: [
          22,
          Math.min(panelH, 190) + 34
        ],
        maxZoom: 16,
        animate: false
      });
    }
  }

  window.filteredBounds = bounds;
}
  
function applyFiltersWithUserLocation(){applyFiltersUnified();}
function applyFilters(){applyFiltersUnified();}

/* ─── LOCATION BRIDGE ───────────────────────────────────────────── */
function _showUserLocation(lat,lng){
  if(!map) return;
  const ll=L.latLng(lat,lng);
  if(_userDot){try{map.removeLayer(_userDot);}catch(e){}_userDot=null;}
  if(_userHalo){try{map.removeLayer(_userHalo);}catch(e){}_userHalo=null;}
  _userHalo=L.circle(ll,{radius:120,stroke:false,fill:true,fillOpacity:0.12}).addTo(map);
  _userDot=L.circleMarker(ll,{radius:6,stroke:true,weight:2,opacity:1,fill:true,fillOpacity:1}).addTo(map);
}

function _clearUserLocationLayers(){
  if(_userDot){try{map.removeLayer(_userDot);}catch(e){}_userDot=null;}
  if(_userHalo){try{map.removeLayer(_userHalo);}catch(e){}_userHalo=null;}
}

function _haversineMiles(lat1,lon1,lat2,lon2){
  const r=v=>(v*Math.PI)/180, R=3958.7613;
  const dLat=r(lat2-lat1),dLon=r(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function _distanceMilesForVenue(loc){
  if(!_userLocationForDistance) return null;
  const lat=Number(loc?.lat),lng=Number(loc?.lng);
  if(!Number.isFinite(lat)||!Number.isFinite(lng)) return null;
  const m=_haversineMiles(_userLocationForDistance.lat,_userLocationForDistance.lng,lat,lng);
  return Number.isFinite(m)?m:null;
}

function _distanceLabelForVenue(loc){
  if(!_userLocationForDistance) return "";
  const m=_distanceMilesForVenue(loc);
  if(m==null) return "";
  return m<0.1?"<0.1 mi":`${m.toFixed(1)} mi`;
}

window.SipSober.setUserLocation=function(lat,lng){
  const LAT=Number(lat),LNG=Number(lng);
  if(!Number.isFinite(LAT)||!Number.isFinite(LNG)) return;
  if(!_mapReady){_pendingUserLocation={lat:LAT,lng:LNG};return;}
  _pendingUserLocation=null;
  _showUserLocation(LAT,LNG);
  _userLocationForDistance={lat:LAT,lng:LNG};
  applyFiltersUnified();
  map.invalidateSize(false);
  map.setView([LAT,LNG],Math.max(map.getZoom(),15),{animate:true});
  const panel=document.getElementById("bottom-panel");
  if(panel) panel.classList.add("expanded");
};

window.SipSober.clearUserLocation=function(){
  _pendingUserLocation=null; _userLocationForDistance=null;
  applyFiltersUnified();
  if(!_mapReady) return;
  _clearUserLocationLayers();
};

window.SipSober.resetMapToDefault=function(){resetMapToDefault();};
window.setUserLocation  =function(lat,lng){window.SipSober.setUserLocation(lat,lng);};
window.clearUserLocation=function(){window.SipSober.clearUserLocation();};
window.resetMapToDefault=function(){window.SipSober.resetMapToDefault();};

/* ─── RESET ─────────────────────────────────────────────────────── */
function fitInitialView(){
  if(!map) return;

  const panel = document.getElementById("bottom-panel");
  const panelH = panel ? panel.getBoundingClientRect().height : 0;

  const defaultBounds = L.latLngBounds(
    [40.705, -74.045],
    [40.855, -73.92]
  );

  map.fitBounds(defaultBounds, {
    paddingTopLeft: [22, window.SipSober?.isEmbed ? 68 : 105],
    paddingBottomRight: [22, Math.min(panelH, 190) + 34],
    maxZoom: 12.4,
    animate: false
  });
}

function resetMapToDefault(){
  closeAllMenus();

  currentMoment = "all";
  _suppressAutoFit = true;

  syncMomentPillsUI();

  window.SipSober.clearUserLocation();

  applyFiltersUnified();

  if (map) {
    map.closeTooltip();
    clearActiveMarker();
    _lastFocusedVenueId = null;
  
    map.invalidateSize({ animate: false, pan: false });
    fitInitialView();
  }
  _suppressAutoFit = false;
}

/* ─── FAVORITES + FOCUS ─────────────────────────────────────────── */
window.SipSober.setFavorites=function(payload){
  const ids=new Set((payload&&payload.ids)||[]);
  document.querySelectorAll(".fav-btn[data-id]").forEach(btn=>btn.classList.toggle("is-fav",ids.has(btn.dataset.id)));
};


window.BrewBreak = window.BrewBreak || {};

function syncMomentPillsUI(){
  document.querySelectorAll(".moment-pill").forEach(btn => {
    const value = String(btn.dataset.moment || "all").toLowerCase().trim();
    btn.classList.toggle("active", value === currentMoment);
  });
}
  
function setMoment(moment){
  const nextMoment = String(moment || "all").toLowerCase();

  currentMoment = ["all", "work", "quick", "social", "relax"].includes(nextMoment)
    ? nextMoment
    : "all";

  _didReceiveInitialMoment = true;

  syncMomentPillsUI();
  updateActiveMoment();
  applyFiltersUnified();
}
  
function bindMomentPills(){
  document.querySelectorAll(".moment-pill").forEach(btn => {
    btn.addEventListener("click", () => {
      const nextMoment = String(btn.dataset.moment || "all").toLowerCase().trim();
      setMoment(nextMoment);
    });
  });
}

window.BrewBreak.setMoment = setMoment;
window.SipSober.setMoment = setMoment;

window.SipSober.focusVenue = function(payload){
  const id = String((typeof payload === "string" ? payload : payload?.venueId) || "").trim();
  if (!id || _lastFocusedVenueId === id) return;

  _lastFocusedVenueId = id;

  applyFiltersUnified();

  let tries = 0;
  (function attempt(){
    const marker = markersById?.[id];
    if (!marker) {
      if (++tries <= 25) return setTimeout(attempt, 120);
      _lastFocusedVenueId = null;
      return;
    }

    const ll = marker.getLatLng();
    map.invalidateSize(false);
    map.setView([ll.lat, ll.lng], 16, { animate: true });

    setTimeout(() => {
  setActiveMarker(marker);

  const loc = locations.find(
    x => String(x.id) === String(id)
  );

  if (loc) {
    renderSelectedVenue(loc);

    marker.bindTooltip(loc.name || "", {
      permanent: false,
      direction: "top",
      offset: [0, -16],
      opacity: 1,
      className: "brewbreak-pin-label"
    }).openTooltip();
  }

}, 200);

const panel = document.getElementById("bottom-panel");

if (panel) {
  panel.classList.add("expanded");
}

})();
};

window.SipSober.focusVenueById=function(id){window.SipSober.focusVenue(id);};
window.SipSober.closePopup = function() {
  try {
    map?.closeTooltip();
    clearActiveMarker();
    _lastFocusedVenueId = null;
  } catch(e) {}
};

/* ─── EVENT WIRING ──────────────────────────────────────────────── */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeAllMenus();
});

document.addEventListener("click", e => {
  if (e.target.closest("a")) {
    closeAllMenus();
    return;
  }

  /* -----------------------------
     BACK FROM VENUE DETAIL
  ----------------------------- */

  const backBtn = e.target.closest(".selected-venue-back");

  if (backBtn) {
    e.preventDefault();
    e.stopPropagation();

    document.body.classList.remove("venue-detail-open");

    try {
      map?.closeTooltip();
    } catch(e) {}

    clearActiveMarker();
    _lastFocusedVenueId = null;

    applyFiltersUnified();

    requestAnimationFrame(() => {
      if (map) {
        map.invalidateSize({
          animate: false,
          pan: false
        });
      }
    });

    return;
  }

  const favBtn = e.target.closest(".fav-btn");
  if (favBtn) {
    e.preventDefault();
    e.stopPropagation();

    const venueId = favBtn.dataset.id;
    const v = locations.find(x => String(x.id) === String(venueId));
    if (!v) return;

    favBtn.classList.toggle("is-fav");

    window.webkit?.messageHandlers?.favorites?.postMessage({
      action: "toggle",
      venue: {
        venueId: String(v.id),
        name: v.name || "",
        address: v.address || "",
        website: normalizeUrl(v.website || ""),
        neighborhood: v.neighborhood || ""
      }
    });

    return;
  }

  const browseCard = e.target.closest(".venue-browse-card");

  if (browseCard) {
    e.preventDefault();
    e.stopPropagation();

    const venueId = browseCard.dataset.browseVenue;

    if (!venueId) return;

    window.SipSober?.focusVenue(venueId);

    return;
  }

    /* -----------------------------
     VENUE DETAIL DROPDOWNS
  ----------------------------- */

  const detailToggle = e.target.closest(".selected-detail-toggle");

  if (detailToggle) {
    e.preventDefault();
    e.stopPropagation();

    const group = detailToggle.closest(".selected-detail-group");

    if (!group) return;

    const isOpen = group.classList.toggle("is-open");

    detailToggle.setAttribute(
      "aria-expanded",
      isOpen ? "true" : "false"
    );

    return;
  }
  
  const planBtn = e.target.closest(".selected-venue-plan");

  if (planBtn) {
    e.preventDefault();
    e.stopPropagation();

    const venueId = planBtn.dataset.planVenue;

    const venue = locations.find(
      loc => String(loc.id) === String(venueId)
    );

    if (!venue) return;

    window.webkit?.messageHandlers?.planHere?.postMessage({
      id: String(venue.id || ""),
      name: venue.name || "",
      neighborhood: venue.neighborhood || ""
    });

    return;
  }
  
  const nameEl = e.target.closest(
    ".card-name[data-focus-id], .featured-title[data-focus-id], .explore-card-name[data-focus-id]"
  );
  if (nameEl) {
    e.preventDefault();
    e.stopPropagation();
    window.SipSober?.focusVenue(nameEl.dataset.focusId);
    return;
  }
  
});


const locateBtn = document.getElementById("locateBtn");
const resetBtn = document.getElementById("resetBtn");

locateBtn?.addEventListener("click", e => {
  e.preventDefault();
  e.stopPropagation();

  if (window.webkit?.messageHandlers?.sipSober) {
    window.webkit.messageHandlers.sipSober.postMessage({ type: "requestLocation" });
  }
});

resetBtn?.addEventListener("click", e => {
  e.preventDefault();
  e.stopPropagation();

  resetMapToDefault();
});
  
(() => {
  const panel = document.getElementById("bottom-panel");
  const toggle = document.getElementById("panel-toggle");
  const label = toggle?.querySelector(".label");
  if (!panel || !toggle) return;

  function syncLabel() {
    const ex = panel.classList.contains("expanded");
    toggle.setAttribute("aria-expanded", ex ? "true" : "false");
    if (label) label.textContent = ex ? "Hide" : "Show";
  }

  toggle.addEventListener("click", e => {
    e.stopPropagation();
    panel.classList.toggle("expanded");
    syncLabel();
  });

  if (window.matchMedia("(max-width:768px)").matches) panel.classList.add("expanded");
  syncLabel();
})();


/* ─── VENUE DETAIL: PREVENT TOP RUBBER-BAND ───────────────────── */

(() => {
  const panelBody = document.getElementById("panel-body");

  if (!panelBody) return;

  let touchStartY = 0;

  panelBody.addEventListener(
    "touchstart",
    e => {
      if (!document.body.classList.contains("venue-detail-open")) return;
      if (!e.touches.length) return;

      touchStartY = e.touches[0].clientY;
    },
    { passive: true }
  );

  panelBody.addEventListener(
    "touchmove",
    e => {
      if (!document.body.classList.contains("venue-detail-open")) return;
      if (!e.touches.length) return;

      const currentY = e.touches[0].clientY;
      const pullingDown = currentY > touchStartY;

      // At the top, don't let the image pull away from the map.
      if (panelBody.scrollTop <= 0 && pullingDown) {
        e.preventDefault();
      }
    },
    { passive: false }
  );
})();


bindMomentPills();
syncMomentPillsUI();
updateActiveMoment();

// In the standalone web version, show all spots immediately.
// In the iOS app, wait for Swift to send the selected moment.
if (!window.SipSober.isEmbed) {
  renderList(
    locations
      .slice()
      .sort((a, b) =>
        (a.name || "").localeCompare(b.name || "")
      )
  );
}

/* =========================================
   VENUE DETAIL — SCROLL-AWARE HEADER
========================================= */

const venueScrollPanel = document.getElementById("panel-body");

if (venueScrollPanel) {
  venueScrollPanel.addEventListener("scroll", () => {
    if (!document.body.classList.contains("venue-detail-open")) {
      document.body.classList.remove("venue-scrolled");
      return;
    }

    document.body.classList.toggle(
      "venue-scrolled",
      venueScrollPanel.scrollTop > 120
    );
  }, { passive: true });
}
