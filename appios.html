<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />

  <title>Zero-Proof Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="/sipsoberleaflet/manifest.json">
  <meta name="theme-color" content="#202329">
  <link rel="apple-touch-icon" href="/sipsoberleaflet/icons/icon-192.png">
  <link rel="icon" href="/sipsoberleaflet/icons/icon-192.png">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />

  <!-- FIX: Leaflet JS in <head> so it's parsed before DOMContentLoaded -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="anonymous"></script>

  <style>
/* =========================================================
   BREW BREAK — MAP REDESIGN
   Warm editorial map + floating discovery cards
========================================================= */

:root {
  /* SIP SOBER / XCODE */
  --espresso: #F7F7FA;
  --espresso-deep: #FFFFFF;
  --coffee: #D7D9E3;

  --cream: #1B1E31;
  --cream-2: #1F2237;
  --cream-3: #252A3F;

  --taupe: rgba(255,255,255,.62);
  --muted: rgba(255,255,255,.46);

  --line: rgba(255,255,255,.08);
  --shadow: rgba(0,0,0,.20);

  --map-height: 66vh;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    system-ui,
    sans-serif;

  background: #fffaf4;
  color: var(--espresso);

  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  display: flex;
  flex-direction: column;
}


/* =========================================================
   MAP
========================================================= */

#map {
  position: relative;
  width: 100%;
  height: var(--map-height);
  min-height: 340px;
  max-height: 570px;
  flex: 0 0 auto;

  background:
  linear-gradient(
    180deg,
    #D9DCE5 0%,
    #E4E6EC 45%,
    #EEEFF3 100%
  );

  overflow: hidden;

  will-change: transform;
  -webkit-transform: translateZ(0);
  transform: translateZ(0);
}

@supports (height: 100dvh) {
  :root {
    --map-height: 66dvh;
  }
}

body.map-loading #map {
  opacity: 0;
}

body.map-ready #map {
  opacity: 1;
  transition: opacity .28s ease;
}


/* =========================================================
   LEAFLET MAP COLOR TREATMENT
========================================================= */

.leaflet-container {
  position: relative;
  background: #E6E8ED;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    system-ui,
    sans-serif;
}

/*
   The map should feel atmospheric, not like a stock map.
*/
.leaflet-tile {
  filter:
    saturate(.55)
    brightness(.98)
    contrast(.88)
    hue-rotate(175deg);
}

.leaflet-tile-pane {
  opacity: .91;
}


/* Warm overall wash */

.leaflet-container::before {
  content: "";
  position: absolute;
  inset: 0;

  z-index: 245;
  pointer-events: none;

  background:
    linear-gradient(
      180deg,
      rgba(27, 30, 49, .22) 0%,
      rgba(31, 34, 55, .13) 30%,
      rgba(34, 38, 58, .06) 60%,
      rgba(27, 30, 49, .12) 100%
    );

  mix-blend-mode: multiply;
}


/*
   Atmospheric top/bottom fade.
   This creates the ombré look from the Brew Break concept.
*/

.leaflet-container::after {
  content: "";
  position: absolute;
  inset: 0;

  z-index: 900;
  pointer-events: none;

  background:
    linear-gradient(
      180deg,
      rgba(47, 31, 22, .96) 0%,
      rgba(60, 41, 30, .88) 8%,
      rgba(79, 57, 43, .72) 18%,
      rgba(101, 78, 61, .48) 30%,
      rgba(126, 105, 88, .25) 42%,
      rgba(126, 105, 88, .08) 53%,
      rgba(126, 105, 88, 0) 63%
    );
}   
    
.leaflet-marker-pane {
  z-index: 1000 !important;
}

.leaflet-tooltip-pane {
  z-index: 1100 !important;
}

.leaflet-popup-pane {
  z-index: 1200 !important;
}

/* =========================================================
   MOMENT FILTERS
   Brew Break segmented control
========================================================= */

#filters {
  position: absolute;
  top: 14px;
  left: 0;
  right: 0;

  z-index: 3000;
  padding: 0 14px;
  pointer-events: none;
}

#filters-main {
  width: 100%;

  display: flex;
  align-items: center;
  pointer-events: auto;
}

/* One floating glass container instead of
   five separate floating pills */
#moment-bar {
  display: flex;
  align-items: center;

  width: 100%;
  max-width: 100%;

  gap: 8px;
  padding: 0;

  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;

  background: transparent;
  border: 0;
  border-radius: 0;

  box-shadow: none;

  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

#moment-bar::-webkit-scrollbar {
  display: none;
}

.moment-pill {
  appearance: none;
  -webkit-appearance: none;

  flex: 1 0 auto;
  height: 34px;
  padding: 0 16px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  border: 1px solid rgba(255, 244, 233, .42);
  border-radius: 999px;

  background: rgba(62, 45, 35, .30);
  color: rgba(255, 250, 245, .96);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    system-ui,
    sans-serif;

  font-size: 11px;
  font-weight: 650;

  letter-spacing: -.01em;
  white-space: nowrap;
  cursor: pointer;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 2px 8px rgba(32,20,14,.08);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  transition:
    background .22s ease,
    border-color .22s ease,
    color .22s ease,
    transform .16s ease,
    box-shadow .22s ease;
}

.moment-pill:active {
  transform: scale(.96);
}

.moment-pill.active {
  background:
    linear-gradient(
      180deg,
      rgba(135, 83, 54, .96) 0%,
      rgba(111, 65, 43, .96) 100%
    );

  border-color: rgba(224, 161, 119, .88);

  color: #FFF9F3;

  box-shadow:
    0 4px 12px rgba(40, 23, 15, .20),
    inset 0 1px 0 rgba(255,255,255,.16);
}


/* =========================================================
   RIGHT MAP CONTROLS
========================================================= */

#toolbar-actions {
  position: absolute;

  right: 14px;
  top: calc(var(--map-height) - 96px);

  z-index: 3200;

  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toolbar-icon-btn {
  appearance: none;
  -webkit-appearance: none;

  width: 42px;
  height: 42px;

  padding: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  border: 1px solid rgba(70, 50, 40, .09);

  background: rgba(255, 250, 245, .94);

  color: #3c2b24;

  font-size: 17px;
  font-weight: 600;

  box-shadow:
    0 7px 20px rgba(51, 34, 27, .12),
    inset 0 1px 0 rgba(255,255,255,.7);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  cursor: pointer;

  transition: transform .15s ease;
}

.toolbar-icon-btn:active {
  transform: scale(.92);
}


/* =========================================================
   BOTTOM DISCOVERY SHEET
========================================================= */

#bottom-panel {
  position: relative;

  flex: 1 1 auto;
  min-height: 0;
  margin-top: -14px;

  z-index: 500;
  display: flex;
  flex-direction: column;

  padding:
    0
    0
    calc(10px + env(safe-area-inset-bottom));

  background:
  linear-gradient(
    180deg,
    #D8D3D0 0%,
    #DFDBD8 48%,
    #E6E2DF 100%
  );

  border-radius: 22px 22px 0 0;

  border-top:
    1px solid rgba(42, 33, 29, .10);

  box-shadow:
    0 -8px 28px rgba(42, 33, 29, .10);

  overflow: hidden;
}


#panel-header {
  display: none;
}

#panel-body {
  flex: 1 1 auto;
  min-height: 0;

  overflow-y: auto;
  overflow-x: hidden;

  -webkit-overflow-scrolling: touch;
  padding: 0 0 10px;
}

#results {
  padding: 0;
}


/* =========================================================
   RESULTS HEADER
========================================================= */

#panel-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;
}

#panel-meta-row .active-filters {
  flex: 1 1 auto;

  display: none;
  flex-wrap: wrap;

  gap: 6px;

  margin: 0;
  padding: 0;
}

#panel-meta-row > div:last-child {
  width: 100%;

  display: flex !important;
  align-items: center !important;
  justify-content: flex-start !important;

  gap: 8px !important;
}

#sortBtn {
  appearance: none;
  -webkit-appearance: none;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  height: 27px;
  padding: 0 10px;
  border-radius: 999px;

  background: #E8EAF1;
  border: 1px solid rgba(31, 34, 55, .08);
  color: #62677A;
  
  font-size: 10.5px;
  font-weight: 700;

  letter-spacing: .03em;
  pointer-events: none;
}

#results-count {
  margin: 0;
  font-size: 12.5px;
  font-weight: 600;

  color: #686D80;

  white-space: nowrap;
}


/* =========================================================
   MAP SUMMARY / PLAN PANEL
========================================================= */

.map-summary-card {
  padding: 18px 20px 20px;
}

.map-summary-eyebrow,
.selected-venue-eyebrow {
  margin-bottom: 8px;

  color: rgba(61, 47, 41, .54);

  font-size: 9.5px;
  font-weight: 750;

  letter-spacing: .15em;
  text-transform: uppercase;
}

.map-summary-title {
  margin: 0 0 6px;

  color: #30241F;

  font-size: 22px;
  font-weight: 700;

  line-height: 1.08;
  letter-spacing: -.035em;
}

.map-summary-copy {
  max-width: 310px;

  margin: 0 0 17px;

  color: rgba(61, 47, 41, .62);

  font-size: 12.5px;
  line-height: 1.42;
}


/* Make a Plan */

.make-plan-btn {
  appearance: none;
  -webkit-appearance: none;

  width: 100%;
  min-height: 46px;

  padding: 0 16px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border: 0;
  border-radius: 15px;

  background: #30241F;
  color: #FFF9F3;

  font-family: inherit;

  font-size: 13px;
  font-weight: 650;

  letter-spacing: -.01em;

  box-shadow:
    0 7px 18px rgba(48, 36, 31, .16),
    inset 0 1px 0 rgba(255,255,255,.07);

  cursor: pointer;

  transition:
    transform .16s ease,
    box-shadow .16s ease,
    background .16s ease;
}

.make-plan-btn:active {
  transform: scale(.985);

  box-shadow:
    0 3px 10px rgba(48, 36, 31, .12);
}

.make-plan-arrow {
  font-size: 17px;
  font-weight: 400;

  opacity: .82;
}

/* =========================================================
   BROWSE VENUES
========================================================= */

.venue-browser {
  padding: 0 20px 22px;
}

.venue-browser-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.venue-browse-card {
  appearance: none;
  -webkit-appearance: none;

  width: 100%;
  padding: 14px 15px;

  display: block;

  border: 1px solid rgba(61, 47, 41, .08);
  border-radius: 16px;

  background: rgba(255, 250, 245, .48);

  font-family: inherit;
  text-align: left;

  cursor: pointer;

  box-shadow:
    0 3px 10px rgba(48, 36, 31, .035),
    inset 0 1px 0 rgba(255,255,255,.35);

  transition:
    transform .16s ease,
    background .16s ease,
    box-shadow .16s ease;
}

.venue-browse-card:active {
  transform: scale(.985);

  background: rgba(255, 250, 245, .68);

  box-shadow:
    0 2px 6px rgba(48, 36, 31, .04);
}

.venue-browse-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;

  gap: 12px;
}

.venue-browse-name {
  min-width: 0;

  color: #30241F;

  font-size: 14px;
  font-weight: 700;

  line-height: 1.2;
  letter-spacing: -.02em;
}

.venue-browse-arrow {
  flex: 0 0 auto;

  color: rgba(61, 47, 41, .35);

  font-size: 15px;
  font-weight: 400;
}

.venue-browse-meta {
  margin-top: 4px;

  color: rgba(61, 47, 41, .48);

  font-size: 10.5px;
  font-weight: 550;

  line-height: 1.25;
}

.venue-browse-note {
  margin-top: 8px;

  color: rgba(61, 47, 41, .65);

  font-size: 11.5px;
  line-height: 1.38;
}

.venue-browse-moments {
  display: flex;
  flex-wrap: wrap;

  gap: 5px;

  margin-top: 10px;
}

.venue-moment-tag {
  display: inline-flex;
  align-items: center;

  min-height: 21px;
  padding: 0 8px;

  border-radius: 999px;

  background: rgba(61, 47, 41, .065);

  color: rgba(61, 47, 41, .62);

  font-size: 9.5px;
  font-weight: 650;

  text-transform: capitalize;
}
    

/* =========================================================
   SELECTED VENUE
========================================================= */

.selected-venue-card {
  padding: 18px 20px 20px;
}

.selected-venue-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;

  gap: 14px;
}

.selected-venue-info {
  flex: 1;
  min-width: 0;
}

.selected-venue-name {
  margin: 0 0 5px;

  color: #30241F;

  font-size: 21px;
  font-weight: 700;

  line-height: 1.08;
  letter-spacing: -.035em;
}

.selected-venue-meta {
  margin-bottom: 8px;

  color: rgba(61, 47, 41, .50);

  font-size: 11px;
  font-weight: 550;
}

.selected-venue-note {
  max-width: 300px;

  color: rgba(61, 47, 41, .66);

  font-size: 12.5px;
  line-height: 1.4;
}

.selected-fav {
  flex: 0 0 auto;

  margin-top: -2px;

  color: rgba(61, 47, 41, .28);
}

.selected-fav.is-fav {
  color: #30241F;
}


/* Venue actions */

.selected-venue-actions {
  display: flex;

  gap: 8px;

  margin-top: 16px;
}

.selected-venue-secondary,
.selected-venue-plan {
  appearance: none;
  -webkit-appearance: none;

  min-height: 43px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  border-radius: 14px;

  font-family: inherit;

  font-size: 12px;
  font-weight: 650;

  text-decoration: none;

  cursor: pointer;
}

.selected-venue-secondary {
  flex: 0 0 auto;

  padding: 0 17px;

  background: rgba(255, 250, 245, .58);

  border: 1px solid rgba(61, 47, 41, .09);

  color: #4A3931;
}

.selected-venue-plan {
  flex: 1;

  padding: 0 15px;

  justify-content: space-between;

  background: #30241F;

  border: 1px solid #30241F;

  color: #FFF9F3;

  box-shadow:
    0 6px 16px rgba(48, 36, 31, .14);
}

.selected-venue-secondary:active,
.selected-venue-plan:active {
  transform: scale(.98);
}




/* =========================================================
   FAVORITES
========================================================= */

.fav-btn {
  position: relative;
  z-index: 3;

  appearance: none;

  border: 0;
  background: transparent;

  padding: 2px;

  color: #B6BAC8;

  font-size: 19px;

  line-height: 1;

  cursor: pointer;

  transition:
    color .16s ease,
    transform .16s ease;
}

.fav-btn:active {
  transform: scale(.86);
}

.fav-btn.is-fav {
  color: #1F2237;
}


/* =========================================================
   ACTIVE FILTER
========================================================= */

.active-filters {
  display: none;
}

.filter-pill {
  display: inline-flex;
  align-items: center;

  gap: 5px;

  padding: 4px 8px;

  border-radius: 999px;

  background: #f1e6dc;

  color: #75655c;

  font-size: 10.5px;
  font-weight: 650;
}

.filter-pill-x {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  width: 15px;
  height: 15px;

  border-radius: 50%;

  background: rgba(64, 46, 38, .06);

  color: #75655c;

  font-size: 11px;

  cursor: pointer;
}


/* =========================================================
   POPUP — BREW BREAK CARD
========================================================= */

.leaflet-popup {
  margin-bottom: 10px;
}

.leaflet-popup-content-wrapper {
  padding: 0 !important;

  border-radius: 20px !important;

  background:
    rgba(255, 250, 245, .97) !important;

  border:
    1px solid rgba(73, 52, 42, .08);

  box-shadow:
    0 18px 45px rgba(46, 30, 23, .18) !important;

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.leaflet-popup-content {
  width: auto !important;
  max-width: none !important;

  margin: 0 !important;
}

.leaflet-popup-tip {
  background: #fffaf5 !important;

  box-shadow: none !important;
}

.ss-popup--simple {
  min-width: 220px;
  max-width: 270px;

  padding: 14px;

  color: #33251f;
}

.ss-popup-top {
  display: flex;

  gap: 11px;

  align-items: flex-start;
}

.ss-popup-text {
  flex: 1;

  min-width: 0;
}

.ss-popup-img-wrap {
  display: block;

  flex: 0 0 78px;

  margin: 0;
}

.ss-popup-img {
  display: block;

  width: 78px;
  height: 70px;

  object-fit: cover;

  border-radius: 13px;
}

.ss-popup--simple .ss-popup-title {
  margin: 0 0 4px;

  color: #30221c;

  font-size: 13.5px;
  font-weight: 700;

  line-height: 1.18;

  letter-spacing: -.02em;
}

.ss-popup--simple .ss-popup-tags {
  margin: 0 0 5px;

  color: #8c7c72;

  font-size: 10.5px;

  line-height: 1.2;
}

.ss-popup--simple .ss-popup-meta {
  margin: 0 0 8px;

  color: #6f6058;

  font-size: 10.5px;

  line-height: 1.28;
}

.ss-popup--simple .ss-popup-actions {
  display: flex;

  gap: 6px;

  align-items: center;

  margin-top: 6px;
}

.ss-popup--simple .ss-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-height: 27px;

  padding: 0 10px;

  border-radius: 999px;

  background: #49352b;

  border: 1px solid #49352b;

  color: #fffaf5;

  font-size: 10px;
  font-weight: 650;

  text-decoration: none;

  white-space: nowrap;
}

.ss-popup--simple .ss-pill.secondary {
  background: #eee2d7;

  border-color:
    rgba(72, 51, 41, .07);

  color: #4d392f;
}

.leaflet-container a.leaflet-popup-close-button {
  top: 5px !important;
  right: 5px !important;

  width: 26px !important;
  height: 26px !important;

  color: rgba(55, 39, 32, .42) !important;

  font-size: 18px !important;

  line-height: 25px !important;
}


/* =========================================================
   HIDE DEFAULT LEAFLET CONTROLS
========================================================= */

.leaflet-control-zoom {
  display: none !important;
}

.leaflet-control-attribution {
  opacity: .38;

  font-size: 7px !important;

  background:
    rgba(255,250,245,.58) !important;
}


/* =========================================================
   USER LOCATION
========================================================= */

.leaflet-interactive {
  transition:
    fill .2s ease,
    stroke .2s ease;
}


/* =========================================================
   UNUSED LEGACY ELEMENTS
========================================================= */

#panel-toggle,
#panel-toggle .handle,
#panel-toggle .label {
  display: none;
}

.compact-card,
.card-top,
.card-name,
.card .meta,
#bottom-panel .card p,
#bottom-panel .card a.card-link {
  /* retained so old JS never breaks */
}


/* =========================================================
   EMBED MODE
========================================================= */

body.ss-embed #filters {
  display: flex !important;
}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 390px) {

  :root {
    --map-height: 64vh;
  }

  @supports (height: 100dvh) {
    :root {
      --map-height: 64dvh;
    }
  }

  #map {
    min-height: 320px;
  }

  #toolbar-actions {
    right: 12px;

    top: calc(var(--map-height) - 92px);
  }
}
</style>

<body>

<!-- TOP FILTER BAR -->
<div id="filters" class="topbar filterbar">
  <div id="filters-main">
    <div id="moment-bar" aria-label="Find your moment">
      <button class="moment-pill active" type="button" data-moment="all">All</button>
      <button class="moment-pill" type="button" data-moment="quick">Quick</button>
      <button class="moment-pill" type="button" data-moment="work">Work</button>
      <button class="moment-pill" type="button" data-moment="relax">Relax</button>
      <button class="moment-pill" type="button" data-moment="social">Social</button>
    </div>
  </div>
</div>

<div id="map"></div>

/* ─── STATE ────────────────────────────────────────────────────── */
let map, markersLayer, markersById={};
let _mapReady=false, _pendingUserLocation=null;
let currentMoment = "all";
let _didReceiveInitialMoment = false;
let _userLocationForDistance=null, _userDot=null, _userHalo=null;
let _activeMarker=null, _lastFocusedVenueId=null;
let _suppressAutoFit = false;
let defaultIcon, activeIcon, currentIcon;
const mobileQuery = window.matchMedia("(max-width:767px)");

const manhattanLockBounds    = L.latLngBounds([40.5,-74.3],[40.98,-73.6]);
const manhattanInitialBounds = L.latLngBounds([40.70,-74.05],[40.88,-73.90]);

/* ─────────────────────────────────────────────────────────────────
   FIX 2: Map initialises AFTER the browser has completed its first
   paint. This guarantees Leaflet reads the true #map dimensions,
   which eliminates both the grey-tile gap and the layout jump.
   ───────────────────────────────────────────────────────────────── */
function _initMap(){
  map = L.map("map",{
    zoomControl: false,
    scrollWheelZoom: true,
    preferCanvas: true,
    // FIX 3: tap:false stops Leaflet's iOS tap shim from triggering
    // an unwanted invalidateSize() that causes the visible jump.
    tap: false
  }).setView([40.758, -73.9855],11.2);

  const tiles = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png?key=cb1_32mn_1_c50a8550ac3189af34a5b1e6",
  {
    maxZoom: 20,
    subdomains: "abcd",
    attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
    updateWhenIdle: true,
    keepBuffer: 6,
    detectRetina: false,
    updateWhenZooming: false
  }
);

  tiles.addTo(map);

  tiles.once("load", () => {
    document.body.classList.remove("map-loading");
    document.body.classList.add("map-ready");
    if (map) {
      map.invalidateSize({ animate: false, pan: false });
    }
  });

  map.setMaxBounds(manhattanLockBounds);
  map.options.maxBoundsViscosity = 0.1;
  map.setMinZoom(11.5);
  markersLayer = L.layerGroup().addTo(map);

  /* ─── FIX 5: Clean, two-step invalidateSize sequence ────────────
     • rAF frame 1 → layout is done
     • rAF frame 2 → paint is done → NOW call invalidateSize
     • 300 ms later → catch any WKWebView async settle
  ────────────────────────────────────────────────────────────── */
  function kickSize() {
    if (!map) return;
    requestAnimationFrame(() => {
      map.invalidateSize({ animate: false, pan: false });
    });
  }

  map.whenReady(() => {
    kickSize();
    setTimeout(() => {
      if (map) map.invalidateSize({ animate: false, pan: false });
    }, 150);
  });

  window.addEventListener("resize", kickSize);
  window.addEventListener("orientationchange", () => {
    setTimeout(kickSize, 150);
  });

  map.on("popupclose", () => {
    clearActiveMarker();
    _lastFocusedVenueId = null;
    applyFiltersUnified();
  });

  _buildIcons();
  applyIconForViewport();
  mobileQuery.addEventListener("change", applyIconForViewport);

  _mapReady = true;
  if(_pendingUserLocation){
    window.SipSober.setUserLocation(_pendingUserLocation.lat,_pendingUserLocation.lng);
    _pendingUserLocation = null;
  }

  if (!window.SipSober.isEmbed || _didReceiveInitialMoment) {
    applyFiltersUnified();
  }
  
  window.SipSober?.sendVenuesToNative?.();
  kickSize();
}

// Start the map as soon as the DOM is ready
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", () => {
    requestAnimationFrame(_initMap);
  });
} else {
  requestAnimationFrame(_initMap);
}

/* ─── ICONS ────────────────────────────────────────────────────── */
function makePinIconSVG(hex="#473E31", size=[18,26], opts = {}) {
  const [w, h] = size;

  return `
  <svg xmlns="http://www.w3.org/2000/svg"
       width="${w}"
       height="${h}"
       viewBox="0 0 18 26">

      <defs>
        <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow
              dx="0"
              dy="1"
              stdDeviation="1"
              flood-color="rgba(0,0,0,.18)"/>
        </filter>
      </defs>

      <path
        filter="url(#shadow)"
        d="M9 1
           C5 1 2 4.2 2 8
           C2 13.5 9 24 9 24
           C9 24 16 13.5 16 8
           C16 4.2 13 1 9 1Z"
        fill="${hex}"/>

      <circle
        cx="9"
        cy="8"
        r="2.2"
        fill="#F7F5F2"/>

  </svg>
  `;
}

function makeIcon(size=[28,38], color="#1F2430"){
  return L.icon({
    iconUrl:
      "data:image/svg+xml;utf8," +
      encodeURIComponent(makePinIconSVG(color, size)),
    iconSize: size,
    iconAnchor: [Math.floor(size[0] / 2), size[1]],
    popupAnchor: [0, -Math.floor(size[1] * 0.84)]
  });
}

function _buildIcons() {
  const isMobile = mobileQuery.matches;

  if (isMobile) {
    defaultIcon = makeIcon([12,18], "#473E31");
    activeIcon  = makeIcon([14,21], "#2F281F");
  } else {
    defaultIcon = makeIcon([18,26], "#473E31");
    activeIcon  = makeIcon([20,30], "#2F281F");
  }

  currentIcon = defaultIcon;
  L.Marker.prototype.options.icon = currentIcon;
}

const __origMarkerFactory = L.marker;
L.marker = function(latlng,options){
  const opts=options||{};
  if(!opts.icon) opts.icon=currentIcon||makeIcon();
  return __origMarkerFactory.call(this,latlng,opts);
};

function setActiveMarker(m){
  if(_activeMarker&&_activeMarker!==m) _activeMarker.setIcon(defaultIcon);
  _activeMarker=m||null;
  if(_activeMarker) _activeMarker.setIcon(activeIcon);
}

function clearActiveMarker(){
  if(_activeMarker) _activeMarker.setIcon(defaultIcon);
  _activeMarker=null;
}

function applyIconForViewport(){
  if(!map) return;
  _buildIcons();
  if(markersLayer&&markersLayer.eachLayer){
    markersLayer.eachLayer(layer=>{
      if(!layer||typeof layer.setIcon!=="function") return;
      layer.setIcon(layer===_activeMarker?activeIcon:defaultIcon);
    });
  }
}

/* ─── UI HELPERS ───────────────────────────────────────────────── */
function closeAllMenus(){
  // old dropdown menus are gone
}

function normalizeUrl(u){
  u=String(u||"").trim();
  if(!u||u.toLowerCase()==="n/a") return "";
  if(!/^https?:\/\//i.test(u)) u="https://"+u;
  return u;
}

function matchesSearch(loc,q){
  if(!q) return true;
  return [loc.name, loc.address, loc.neighborhood]
    .filter(Boolean)
    .join(" ")
    .toLowerCase()
    .includes(q.toLowerCase());
}

function matchesMoment(loc){
  if(currentMoment === "all") return true;

  const moments = Array.isArray(loc.moments)
    ? loc.moments.map(m => String(m).toLowerCase())
    : [];

  return moments.includes(currentMoment);
}

function updateActiveMoment(){
  const c = document.getElementById("active-filters");
  if(!c) return;

  c.innerHTML = "";

  if(currentMoment === "all"){
    c.style.display = "none";
    return;
  }

  c.style.display = "flex";

  const p = document.createElement("span");
  p.className = "filter-pill";

  const x = document.createElement("span");
  x.className = "filter-pill-x";
  x.textContent = "×";
  x.addEventListener("click", () => {
    currentMoment = "all";
    syncMomentPillsUI();
    applyFiltersUnified();
  });

  const l = document.createElement("span");
  l.textContent = currentMoment.charAt(0).toUpperCase() + currentMoment.slice(1);

  p.appendChild(x);
  p.appendChild(l);
  c.appendChild(p);
}

/* ─── NATIVE BRIDGE ────────────────────────────────────────────── */
let _didSendVenuesToNative=false;
function _venueForNative(loc){
  return {
    id: String(loc.id || ""),
    name: String(loc.name || ""),
    address: String(loc.address || ""),
    neighborhood: String(loc.neighborhood || ""),
    website: normalizeUrl(loc.website || ""),
    lat: Number(loc.lat || 0),
    lng: Number(loc.lng || 0),
    imageUrl: String(loc.imageUrl || "")
  };
}
  
window.SipSober.sendVenuesToNative=function(arg){
  try{
    const force=(typeof arg==="boolean")?arg:false;
    const source=Array.isArray(arg)?arg:(locations||[]);
    if(_didSendVenuesToNative&&!force&&!Array.isArray(arg)) return;
    const venues=source.map(_venueForNative).filter(v=>v.id&&v.name);
    if(window.webkit?.messageHandlers?.sipSober){
      window.webkit.messageHandlers.sipSober.postMessage({type:"venues",venues});
      _didSendVenuesToNative=true;
    }
  }catch(e){}
};

window.addEventListener("load",()=>setTimeout(()=>window.SipSober.sendVenuesToNative(),400));

function renderMarkers(data){
  if(!markersLayer) return{count:0,bounds:null};
  markersLayer.clearLayers(); clearActiveMarker(); markersById={};
  const bounds=L.latLngBounds([]);
  data.forEach(loc=>{
    const m=L.marker([loc.lat,loc.lng]).addTo(markersLayer);
    m.on("click", () => {
      setActiveMarker(m);
      renderSelectedVenue(loc);
    });
    if(loc.id) markersById[String(loc.id)]=m;
    const imgHtml=loc.imageUrl?`<div class="ss-popup-img-wrap"><img class="ss-popup-img" src="${loc.imageUrl}" alt="${loc.name||""}" loading="lazy" onerror="this.closest('.ss-popup-img-wrap')?.remove()"></div>`:"";
    const web=normalizeUrl(loc.website);
    m.bindPopup(`<div class="ss-popup ss-popup--simple"><div class="ss-popup-top">${imgHtml}<div class="ss-popup-text"><div class="ss-popup-title">${loc.name||""}</div>${loc.neighborhood?`<div class="ss-popup-tags">${loc.neighborhood}</div>`:""}<div class="ss-popup-meta">${loc.address||""}</div><div class="ss-popup-actions">${web?`<a class="ss-pill" href="${web}" target="_blank" rel="noopener">Website</a>`:""}<a class="ss-pill secondary" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((loc.name||"")+" "+(loc.address||""))}" target="_blank" rel="noopener">Directions</a></div></div></div></div>`,{minWidth:220,maxWidth:280,closeButton:true,autoPan:true,keepInView:true,autoPanPaddingTopLeft:[18,160],autoPanPaddingBottomRight:[18,260],offset:[0,-18]});
    bounds.extend([loc.lat,loc.lng]);
  });
  return{count:data.length,bounds:data.length?bounds:null};
}

/* ─── FILTER + APPLY ────────────────────────────────────────────── */
function applyFiltersUnified(){
  closeAllMenus();

  const q = (document.getElementById("searchTopInput")?.value || "").trim();

  let filtered = locations.filter(loc => {
    return matchesMoment(loc) && matchesSearch(loc, q);
  });

  const hasLoc = !!_userLocationForDistance;

  if (hasLoc) {
    filtered.sort((a, b) => {
      const da = _distanceMilesForVenue(a);
      const db = _distanceMilesForVenue(b);

      if (da == null && db == null) {
        return (a.name || "").localeCompare(b.name || "", undefined, { sensitivity: "base" });
      }
      if (da == null) return 1;
      if (db == null) return -1;
      if (da !== db) return da - db;

      return (a.name || "").localeCompare(b.name || "", undefined, { sensitivity: "base" });
    });
  } else {
    filtered.sort((a, b) =>
      (a.name || "").localeCompare(b.name || "", undefined, { sensitivity: "base" })
    );
  }

  const sortBtn = document.getElementById("sortBtn");
  if (sortBtn) sortBtn.textContent = hasLoc ? "Miles" : "A–Z";

  renderList(filtered);
  updateActiveMoment();

  if (!map) {
    window.filteredBounds = null;
    return;
  }

  const { count, bounds } = renderMarkers(filtered);

  const panel = document.getElementById("bottom-panel");
  const panelH = panel ? panel.getBoundingClientRect().height : 0;

  const isDefaultView =
    currentMoment === "all" &&
    !q.length &&
    !hasLoc;

  if (!_suppressAutoFit) {
    if (isDefaultView) {
      fitInitialView();
    } else if (count > 0 && bounds) {
      map.fitBounds(bounds, {
        paddingTopLeft: [
          22,
          window.SipSober?.isEmbed ? 68 : 105
        ],
        
        paddingBottomRight: [
          22,
          Math.min(panelH, 190) + 34
        ],
        maxZoom: 16,
        animate: false
      });
    }
  }

  window.filteredBounds = bounds;
}
  
function applyFiltersWithUserLocation(){applyFiltersUnified();}
function applyFilters(){applyFiltersUnified();}

/* ─── LOCATION BRIDGE ───────────────────────────────────────────── */
function _showUserLocation(lat,lng){
  if(!map) return;
  const ll=L.latLng(lat,lng);
  if(_userDot){try{map.removeLayer(_userDot);}catch(e){}_userDot=null;}
  if(_userHalo){try{map.removeLayer(_userHalo);}catch(e){}_userHalo=null;}
  _userHalo=L.circle(ll,{radius:120,stroke:false,fill:true,fillOpacity:0.12}).addTo(map);
  _userDot=L.circleMarker(ll,{radius:6,stroke:true,weight:2,opacity:1,fill:true,fillOpacity:1}).addTo(map);
}

function _clearUserLocationLayers(){
  if(_userDot){try{map.removeLayer(_userDot);}catch(e){}_userDot=null;}
  if(_userHalo){try{map.removeLayer(_userHalo);}catch(e){}_userHalo=null;}
}

function _haversineMiles(lat1,lon1,lat2,lon2){
  const r=v=>(v*Math.PI)/180, R=3958.7613;
  const dLat=r(lat2-lat1),dLon=r(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function _distanceMilesForVenue(loc){
  if(!_userLocationForDistance) return null;
  const lat=Number(loc?.lat),lng=Number(loc?.lng);
  if(!Number.isFinite(lat)||!Number.isFinite(lng)) return null;
  const m=_haversineMiles(_userLocationForDistance.lat,_userLocationForDistance.lng,lat,lng);
  return Number.isFinite(m)?m:null;
}

function _distanceLabelForVenue(loc){
  if(!_userLocationForDistance) return "";
  const m=_distanceMilesForVenue(loc);
  if(m==null) return "";
  return m<0.1?"<0.1 mi":`${m.toFixed(1)} mi`;
}

window.SipSober.setUserLocation=function(lat,lng){
  const LAT=Number(lat),LNG=Number(lng);
  if(!Number.isFinite(LAT)||!Number.isFinite(LNG)) return;
  if(!_mapReady){_pendingUserLocation={lat:LAT,lng:LNG};return;}
  _pendingUserLocation=null;
  _showUserLocation(LAT,LNG);
  _userLocationForDistance={lat:LAT,lng:LNG};
  applyFiltersUnified();
  map.invalidateSize(false);
  map.setView([LAT,LNG],Math.max(map.getZoom(),15),{animate:true});
  const panel=document.getElementById("bottom-panel");
  if(panel) panel.classList.add("expanded");
};

window.SipSober.clearUserLocation=function(){
  _pendingUserLocation=null; _userLocationForDistance=null;
  applyFiltersUnified();
  if(!_mapReady) return;
  _clearUserLocationLayers();
};

window.SipSober.resetMapToDefault=function(){resetMapToDefault();};
window.setUserLocation  =function(lat,lng){window.SipSober.setUserLocation(lat,lng);};
window.clearUserLocation=function(){window.SipSober.clearUserLocation();};
window.resetMapToDefault=function(){window.SipSober.resetMapToDefault();};

/* ─── RESET ─────────────────────────────────────────────────────── */
function fitInitialView(){
  if(!map) return;

  const panel = document.getElementById("bottom-panel");
  const panelH = panel ? panel.getBoundingClientRect().height : 0;

  const defaultBounds = L.latLngBounds(
    [40.705, -74.045],
    [40.855, -73.92]
  );

  map.fitBounds(defaultBounds, {
    paddingTopLeft: [22, window.SipSober?.isEmbed ? 68 : 105],
    paddingBottomRight: [22, Math.min(panelH, 190) + 34],
    maxZoom: 12.4,
    animate: false
  });
}

function resetMapToDefault(){
  closeAllMenus();

  currentMoment = "all";
  _suppressAutoFit = true;

  syncMomentPillsUI();

  window.SipSober.clearUserLocation();

  applyFiltersUnified();

  if (map) {
    map.closePopup();
    map.invalidateSize({ animate: false, pan: false });
    fitInitialView();
  }

  _suppressAutoFit = false;
}

/* ─── FAVORITES + FOCUS ─────────────────────────────────────────── */
window.SipSober.setFavorites=function(payload){
  const ids=new Set((payload&&payload.ids)||[]);
  document.querySelectorAll(".fav-btn[data-id]").forEach(btn=>btn.classList.toggle("is-fav",ids.has(btn.dataset.id)));
};


window.BrewBreak = window.BrewBreak || {};

function syncMomentPillsUI(){
  document.querySelectorAll(".moment-pill").forEach(btn => {
    const value = String(btn.dataset.moment || "all").toLowerCase().trim();
    btn.classList.toggle("active", value === currentMoment);
  });
}
  
function setMoment(moment){
  const nextMoment = String(moment || "all").toLowerCase();

  currentMoment = ["all", "work", "quick", "social", "relax"].includes(nextMoment)
    ? nextMoment
    : "all";

  _didReceiveInitialMoment = true;

  syncMomentPillsUI();
  updateActiveMoment();
  applyFiltersUnified();
}
  
function bindMomentPills(){
  document.querySelectorAll(".moment-pill").forEach(btn => {
    btn.addEventListener("click", () => {
      const nextMoment = String(btn.dataset.moment || "all").toLowerCase().trim();
      setMoment(nextMoment);
    });
  });
}

window.BrewBreak.setMoment = setMoment;
window.SipSober.setMoment = setMoment;

window.SipSober.focusVenue = function(payload){
  const id = String((typeof payload === "string" ? payload : payload?.venueId) || "").trim();
  if (!id || _lastFocusedVenueId === id) return;

  _lastFocusedVenueId = id;

  applyFiltersUnified();

  let tries = 0;
  (function attempt(){
    const marker = markersById?.[id];
    if (!marker) {
      if (++tries <= 25) return setTimeout(attempt, 120);
      _lastFocusedVenueId = null;
      return;
    }

    const ll = marker.getLatLng();
    map.invalidateSize(false);
    map.setView([ll.lat, ll.lng], 16, { animate: true });

    setTimeout(() => {
      setActiveMarker(marker);
    
      const loc = locations.find(
        x => String(x.id) === String(id)
      );
    
      if (loc) {
        renderSelectedVenue(loc);
      }
    
      marker.openPopup();
    
      const c = document.querySelector(".leaflet-popup-close-button");
      if (c) c.addEventListener("click", () => { _lastFocusedVenueId = null; }, { once: true });
    }, 200);

    const panel = document.getElementById("bottom-panel");
    if (panel) panel.classList.add("expanded");
  })();
};

window.SipSober.focusVenueById=function(id){window.SipSober.focusVenue(id);};
window.SipSober.closePopup=function(){try{map?.closePopup();}catch(e){}};

/* ─── EVENT WIRING ──────────────────────────────────────────────── */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeAllMenus();
});

document.addEventListener("click", e => {
  if (e.target.closest("a")) {
    closeAllMenus();
    return;
  }

  const favBtn = e.target.closest(".fav-btn");
  if (favBtn) {
    e.preventDefault();
    e.stopPropagation();

    const venueId = favBtn.dataset.id;
    const v = locations.find(x => String(x.id) === String(venueId));
    if (!v) return;

    favBtn.classList.toggle("is-fav");

    window.webkit?.messageHandlers?.favorites?.postMessage({
      action: "toggle",
      venue: {
        venueId: String(v.id),
        name: v.name || "",
        address: v.address || "",
        website: normalizeUrl(v.website || ""),
        neighborhood: v.neighborhood || ""
      }
    });

    return;
  }

  const browseCard = e.target.closest(".venue-browse-card");

  if (browseCard) {
    e.preventDefault();
    e.stopPropagation();

    const venueId = browseCard.dataset.browseVenue;

    if (!venueId) return;

    window.SipSober?.focusVenue(venueId);

    return;
  }
  
  const nameEl = e.target.closest(
    ".card-name[data-focus-id], .featured-title[data-focus-id], .explore-card-name[data-focus-id]"
  );
  if (nameEl) {
    e.preventDefault();
    e.stopPropagation();
    window.SipSober?.focusVenue(nameEl.dataset.focusId);
    return;
  }
  
});


const locateBtn = document.getElementById("locateBtn");
const resetBtn = document.getElementById("resetBtn");

locateBtn?.addEventListener("click", e => {
  e.preventDefault();
  e.stopPropagation();

  if (window.webkit?.messageHandlers?.sipSober) {
    window.webkit.messageHandlers.sipSober.postMessage({ type: "requestLocation" });
  }
});

resetBtn?.addEventListener("click", e => {
  e.preventDefault();
  e.stopPropagation();

  resetMapToDefault();
});
  
(() => {
  const panel = document.getElementById("bottom-panel");
  const toggle = document.getElementById("panel-toggle");
  const label = toggle?.querySelector(".label");
  if (!panel || !toggle) return;

  function syncLabel() {
    const ex = panel.classList.contains("expanded");
    toggle.setAttribute("aria-expanded", ex ? "true" : "false");
    if (label) label.textContent = ex ? "Hide" : "Show";
  }

  toggle.addEventListener("click", e => {
    e.stopPropagation();
    panel.classList.toggle("expanded");
    syncLabel();
  });

  if (window.matchMedia("(max-width:768px)").matches) panel.classList.add("expanded");
  syncLabel();
})();

bindMomentPills();
syncMomentPillsUI();
updateActiveMoment();

// In the standalone web version, show all spots immediately.
// In the iOS app, wait for Swift to send the selected moment.
if (!window.SipSober.isEmbed) {
  renderList(
    locations
      .slice()
      .sort((a, b) =>
        (a.name || "").localeCompare(b.name || "")
      )
  );
}
  
</script>
